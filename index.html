<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cobrei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#090A1C;--sf:#12103A;--ln:#25205A;--tx:#EEEBFF;--mu:#8D87BE;--ac:#8B6BFF;--ac2:#C0B1FF;--ok:#5EE0B0;--wa:#FFC76B;--late:#FF7A93;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Sora,system-ui,sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:28px 24px calc(110px + env(safe-area-inset-bottom,0px))}
h1{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:0 0 6px}
h2{font-size:15px;font-weight:600;margin:36px 0 6px}
p{margin:0 0 14px;color:var(--mu)}
.mu{color:var(--mu)}.ok{color:var(--ok)}
.big{font-size:44px;font-weight:300;letter-spacing:-.03em;margin:4px 0 0}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--ac),#33199B);display:grid;place-items:center;font-size:22px;margin-bottom:22px}
.welcome{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.back{background:none;border:0;color:var(--mu);font:inherit;padding:0;margin-bottom:22px;cursor:pointer}
.bar{height:4px;background:var(--ln);border-radius:4px;margin:18px 0 20px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.two b{display:block;font-size:19px;font-weight:600}
.two span{font-size:13px;color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--ln);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;width:100%;text-align:left}
.row small{display:block;color:var(--mu);font-size:13px}
.tag{font-size:13px;white-space:nowrap}
.t-ok{color:var(--ok)}.t-wa{color:var(--wa)}.t-late{color:var(--late)}
.seg{display:flex;gap:18px;margin:18px 0 6px;overflow-x:auto}
.seg button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mu);font:inherit;font-size:14px;padding:6px 0;cursor:pointer;white-space:nowrap}
.seg button.on{color:var(--tx);border-color:var(--ac)}
label{display:block;font-size:13px;color:var(--mu);margin:20px 0 4px}
input,select,textarea{width:100%;background:none;border:0;border-bottom:1px solid var(--ln);color:var(--tx);padding:9px 0;font:inherit;font-size:16px;border-radius:0}
textarea{min-height:96px;resize:vertical;border:1px solid var(--ln);border-radius:12px;padding:12px;font-size:14px}
select option{background:var(--sf)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac2)}
button:focus-visible{outline:2px solid var(--ac2);outline-offset:3px}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:600;cursor:pointer;width:100%;margin-top:28px}
.btn.ghost{background:none;border:1px solid var(--ln);color:var(--ac2);margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{background:none;border:1px solid var(--ln);color:var(--mu);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--sf);border-color:var(--ac);color:var(--tx)}
.msg{background:var(--sf);border-radius:16px 16px 16px 4px;padding:14px 16px;font-size:14px;color:var(--tx);white-space:pre-line;margin-top:6px}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--ln);font-size:14px}
.kv span:first-child{color:var(--mu)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-right:10px}
.dot.d{background:var(--ok)}
.fab{position:fixed;right:max(24px,calc(50% - 236px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-size:26px;cursor:pointer;box-shadow:0 8px 24px #8B6BFF55}
nav{position:fixed;left:0;right:0;bottom:0;background:#090A1Cee;backdrop-filter:blur(12px);border-top:1px solid var(--ln);display:flex;justify-content:center;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;width:100%;max-width:520px}
nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:13px;padding:6px 0;cursor:pointer}
nav button.on{color:var(--tx);font-weight:600}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ok);color:#06251A;padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
#toast.on{opacity:1}
h1,.big{text-shadow:0 1px 0 #fff4,0 3px 5px #0009,0 0 24px #8B6BFF77;animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 1px 0 #fff5,0 3px 5px #0009,0 0 36px #8B6BFFcc}}
h2{text-shadow:0 0 12px #8B6BFF55}
.logo{box-shadow:0 0 28px #8B6BFF88;animation:bob 3.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.welcome{text-align:center}
.welcome .logo{width:88px;height:88px;border-radius:28px;font-size:44px;font-weight:600;margin:0 auto 28px;position:relative;background:linear-gradient(120deg,#8B6BFF,#33199B,#C0B1FF,#8B6BFF);background-size:300% 100%;box-shadow:0 0 40px #8B6BFFaa,inset 0 1px 0 #fff5;animation:float 3.2s ease-in-out infinite,shine 5s linear infinite}
.welcome .logo::before,.welcome .logo::after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid #8B6BFF;opacity:0;animation:ring 2.8s ease-out infinite;pointer-events:none}
.welcome .logo::after{animation-delay:1.4s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
@keyframes shine{to{background-position:300% 0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
#app.ini>*:not(.fab){animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards}
#app.ini>:nth-child(2){animation-delay:.05s}#app.ini>:nth-child(3){animation-delay:.1s}#app.ini>:nth-child(4){animation-delay:.15s}#app.ini>:nth-child(5){animation-delay:.2s}#app.ini>:nth-child(6){animation-delay:.25s}#app.ini>:nth-child(7){animation-delay:.3s}#app.ini>:nth-child(8){animation-delay:.35s}#app.ini>:nth-child(9){animation-delay:.4s}#app.ini>:nth-child(10){animation-delay:.45s}
#app.ini>.big{animation:rise .6s cubic-bezier(.2,.8,.2,1) .1s backwards,glow 4s ease-in-out infinite}
#app.ini>.big:active{animation:none}
@media(hover:hover){#app.ini>.big:hover{animation:none}}
.bar{box-shadow:0 0 14px #8B6BFF33}
.bar i{background:linear-gradient(90deg,#8B6BFF,#C0B1FF,#8B6BFF);background-size:200% 100%;box-shadow:0 0 12px #8B6BFFcc;transition:width 1.1s cubic-bezier(.2,.8,.2,1);animation:shine 3s linear infinite}
.gr rect{transform-box:fill-box;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) backwards}
.gr rect:nth-of-type(2){animation-delay:.08s}.gr rect:nth-of-type(3){animation-delay:.16s}.gr rect:nth-of-type(4){animation-delay:.24s}.gr rect:nth-of-type(5){animation-delay:.32s}.gr rect:nth-of-type(6){animation-delay:.4s}
@keyframes grow{from{transform:scaleY(0)}}
.saldo{border-radius:22px;padding:20px;background:linear-gradient(160deg,#1a1450,#12103A 70%);border:1px solid var(--ln)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.acts .btn{margin-top:0;padding:13px 8px;font-size:14px}
#app.ini .fab{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 8px 38px #8B6BFFcc}}
.glass{border-radius:22px;border:1px solid #8B6BFF55;background:linear-gradient(145deg,#ffffff10,#ffffff03),radial-gradient(120% 90% at 100% 0%,#8B6BFF2b,transparent 60%),#12103Aaa;box-shadow:inset 0 1px 0 #ffffff1a,0 14px 40px #00000066;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.glass.cht{padding:18px 18px 12px;margin-top:20px}
.glass.cht h2{margin-top:0}
@keyframes pgin{from{opacity:0;transform:translateY(18px)}}
@keyframes pgout{to{opacity:0;transform:translateY(-8px)}}
#app.pg>*:not(.fab){animation:pgin .5s cubic-bezier(.2,.8,.2,1) backwards}
#app.pg>:nth-child(2){animation-delay:.04s}#app.pg>:nth-child(3){animation-delay:.08s}#app.pg>:nth-child(4){animation-delay:.12s}#app.pg>:nth-child(5){animation-delay:.16s}#app.pg>:nth-child(6){animation-delay:.2s}#app.pg>:nth-child(7){animation-delay:.24s}#app.pg>:nth-child(8){animation-delay:.28s}#app.pg>:nth-child(9){animation-delay:.32s}#app.pg>:nth-child(10){animation-delay:.36s}
#app.pg>h1,#app.pg>.big{animation:pgin .5s cubic-bezier(.2,.8,.2,1) backwards,glow 4s ease-in-out infinite}
#app.pg>h1:active,#app.pg>.big:active{animation:none}
@media(hover:hover){#app.pg>h1:hover,#app.pg>.big:hover{animation:none}}
#app.out>*:not(.fab){animation:pgout .14s ease-in forwards}
#ind{position:absolute;top:0;left:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:var(--ac2);box-shadow:0 0 12px #8B6BFFcc;transition:transform .45s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
body{font-variant-numeric:tabular-nums}
.lf{display:flex;align-items:center;min-width:0}.lf>span{min-width:0}
.av{display:inline-grid;place-items:center;flex:none;width:40px;height:40px;margin-right:12px;border-radius:50%;font-style:normal;font-weight:600;font-size:14px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 70% 58%),hsl(calc(var(--h) + 35) 65% 40%));box-shadow:inset 0 1px 0 #ffffff40}
.swr{position:relative;overflow:hidden;overflow:clip visible}
.swf{position:relative;background:var(--bg);transition:transform .3s cubic-bezier(.2,.8,.2,1);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.swa{position:absolute;top:0;right:0;bottom:0;display:flex;align-items:center;gap:6px;padding-right:2px}
.swa button{border:0;color:#fff;font:inherit;font-size:13px;font-weight:600;width:70px;height:52px;border-radius:14px;cursor:pointer}
.swa .a1{background:var(--ac)}.swa .a2{background:#1f9d73}
.ins{margin:10px 0 4px;color:var(--tx);font-size:14px}
.trust{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;margin-top:26px;font-size:12px;color:var(--mu)}
.trust.l{justify-content:flex-start;margin:0 0 6px}
.trust span{display:inline-flex;align-items:center;gap:6px}.trust svg{width:15px;height:15px;color:var(--ok)}
.hint{margin-top:24px;font-size:12px;color:var(--mu);animation:hb 2s ease-in-out infinite}
@keyframes hb{50%{transform:translateY(6px)}}
.how{padding:30px 0 10px}.how>h2{text-align:center;margin:0 0 30px}
.mk{display:flex;align-items:center;gap:18px;margin:0 0 36px;opacity:0;transform:translateX(-70px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.mk.r{flex-direction:row-reverse;transform:translateX(70px)}
.mk.in{opacity:1;transform:none}
.ph{width:132px;flex:none;min-height:150px;border-radius:22px;padding:14px;display:flex;flex-direction:column;justify-content:center;gap:10px;border:1px solid #8B6BFF55;background:linear-gradient(145deg,#ffffff10,#ffffff03),#12103A;box-shadow:inset 0 1px 0 #ffffff1a,0 14px 30px #00000066}
.mk.in .ph{animation:bob 4s ease-in-out infinite}
.ln{display:block;height:9px;border-radius:5px;background:var(--ln)}.ln.w1{width:90%;background:var(--ac)}.ln.w2{width:70%}.ln.w3{width:50%}
.ch{font-size:11px;padding:6px 8px;border:1px solid var(--ln);border-radius:99px;text-align:center;color:var(--mu)}.ch.on{border-color:var(--ac);color:var(--tx);background:var(--bg)}
.ph.ok3{align-items:center;text-align:center;gap:8px}.ph.ok3 svg{width:48px;height:48px}.ph.ok3 circle{fill:none;stroke:var(--ok);stroke-width:2}.ph.ok3 path{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.mt b{display:block;font-size:16px;margin-bottom:4px}.mt p{margin:0;font-size:14px}
.vz{text-align:center;padding:40px 10px}
.vz svg{width:96px;height:96px;display:block;margin:0 auto 14px;animation:bob 3.2s ease-in-out infinite}
.vz svg circle:first-child{transform-origin:center;transform-box:fill-box;animation:spinr 18s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.vz b{display:block;font-size:17px}
.vz .btn{width:auto;padding:12px 26px;margin-top:6px}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:7}
.conf i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;opacity:0;animation:fall linear forwards}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),105vh) rotate(540deg)}}
.glass,.ph,.gc{position:relative;border:0;border-radius:26px;background:linear-gradient(160deg,#ffffff1f 0%,#ffffff0a 42%,#ffffff05 100%),#1a1450a6;box-shadow:inset 0 1px 1px #ffffff55,inset 0 -1px 1px #ffffff14,inset 0 0 22px #ffffff0a,0 18px 44px #00000073;-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6)}
.glass::before,.ph::before,.gc::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(145deg,#ffffff8c,#ffffff1a 30%,#8B6BFF59 60%,#ffffff59);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none}
.gc{padding:18px;margin:0 0 14px}
.topb{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-8px -8px 6px;padding:8px;border-radius:18px;background:transparent;transition:background .3s,box-shadow .3s}
.topb.sc{background:linear-gradient(155deg,#ffffff2e,#ffffff0d);box-shadow:inset 0 1px 0 #ffffff66,0 8px 24px #00000080;-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5)}
.tl{display:flex;align-items:center;gap:8px;font-weight:600}
.lg{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;font-style:normal;background:linear-gradient(135deg,var(--ac),#33199B)}
.tr{display:flex;gap:8px}
.tb{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:12px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.tb.p{background:var(--ac);border-color:var(--ac);font-weight:600}
.rv{opacity:0;transform:translateY(34px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1);margin:0 0 44px}
.rv.in{opacity:1;transform:none}
.sh{text-align:center;margin:0 0 6px}.sub2{text-align:center;margin:0 0 18px;font-size:14px}
.fd{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff14}
.fd span{width:92px;flex:none;font-size:12px;color:var(--mu)}
.typ{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--ac),var(--ac2));width:0}
.rv.in .typ{animation:fillw 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.rv.in .t2{animation-delay:.6s}.rv.in .t3{animation-delay:1.2s}
@keyframes fillw{to{width:var(--w)}}
.fbtn{margin-top:16px;text-align:center;padding:12px;border-radius:14px;background:var(--ac);font-weight:600}
.rv.in .fbtn{animation:btnp 1.8s 2s ease-in-out infinite}
@keyframes btnp{50%{box-shadow:0 8px 28px #8B6BFF99}}
.tm .lb{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}.tm .lb b{font-weight:600}.tm .lb span{color:var(--mu)}
.tm .tr2{height:8px;border-radius:6px;background:#ffffff14;overflow:hidden;margin-bottom:16px}
.tm .tr2 i{display:block;height:100%;width:0;border-radius:6px}
.tm .px i{background:var(--ok)}.tm .bl i{background:var(--wa)}
.rv.in .tm .tr2 i{animation:fillw 1.2s .3s cubic-bezier(.2,.8,.2,1) forwards}
.note{font-size:12px;margin:0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg .gc{margin:0;padding:16px}
.fg b{display:block;margin:10px 0 4px;font-size:14px}.fg p{margin:0;font-size:13px}
.fi{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#8B6BFF2e;color:var(--ac2);transition:transform .25s}.fi svg{width:22px;height:22px}
.fg .gc:active .fi{transform:translateY(-4px)}
@media(hover:hover){.fg .gc:hover .fi{transform:translateY(-4px)}}
.fq details{padding:14px 0;border-bottom:1px solid #ffffff14}.fq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
.fq summary::-webkit-details-marker{display:none}
.fq summary::after{content:"+";color:var(--ac2);transition:transform .25s}
.fq details[open] summary::after{transform:rotate(45deg)}
.fq details p{margin:8px 0 0;font-size:14px}
.cta{text-align:center}.cta h2{margin:0 0 6px}.cta .btn{margin-top:12px}.cta p{margin-bottom:6px}
@media(prefers-reduced-motion:reduce){.typ,.tm .tr2 i{width:var(--w)}}
.welcome{padding-top:34px}
.ph,.gc{background:linear-gradient(115deg,#ffffff00 40%,#ffffff1c 50%,#ffffff00 60%),linear-gradient(155deg,#ffffff33 0%,#ffffff12 38%,#ffffff08 62%,#ffffff1c 100%);box-shadow:inset 0 1px 0 #ffffff80,inset 0 -1px 0 #ffffff1f,inset 0 0 18px #ffffff12,0 14px 28px #000000a6,0 3px 8px #00000080;-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.ph::before,.gc::before{background:linear-gradient(145deg,#ffffffb3,#ffffff26 35%,#ffffff0d 65%,#ffffff66)}
/* TEMA FUTURISTA (para desfazer, apague a partir daqui ate o fim do bloco) */
:root{--fx:"Space Grotesk","Sora",system-ui,sans-serif}
body{background:radial-gradient(circle at 1px 1px,#ffffff0f 1px,transparent 0) 0 0/24px 24px,var(--bg)}
h1,.big,h2,.btn,.tb,nav button,.chip,.seg button,.bk,.tag,label{font-family:var(--fx)}
h1{font-weight:600;letter-spacing:-.03em}
h2{font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);text-shadow:none}
.sh,.cta h2{font-size:22px;letter-spacing:-.02em;text-transform:none;color:var(--tx);font-weight:600}
.big{font-weight:300;letter-spacing:-.045em}
h1,.big{text-shadow:none}
@keyframes glow{50%{text-shadow:none}}
label{text-transform:uppercase;letter-spacing:.1em;font-size:11px}
.btn{border-radius:12px;letter-spacing:.02em;box-shadow:inset 0 0 0 1px #ffffff2e,0 8px 22px #8B6BFF40}
.btn.ghost{box-shadow:none}
.chip{border-radius:10px}
.glass,.ph,.gc{border-radius:18px}
.bar{height:3px}
nav button{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.saldo>p:first-child::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:8px;box-shadow:0 0 8px var(--ok);animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.bk{display:inline-flex;align-items:center;gap:8px;margin:0 0 20px;padding:9px 16px 9px 11px;border-radius:12px;font-weight:600;font-size:14px;letter-spacing:.02em;color:#fff;cursor:pointer;background:linear-gradient(155deg,#8B6BFF,#5b3fd1);border:0;box-shadow:inset 0 1px 0 #ffffff59,0 8px 22px #8B6BFF55}
.bk svg{width:18px;height:18px;transition:transform .2s}
.bk:active svg{transform:translateX(-4px)}
@media(hover:hover){.bk:hover svg{transform:translateX(-4px)}}
.sug{margin:20px 0 0}
.sug .sl{display:flex;align-items:center;gap:8px;font-family:var(--fx);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac2)}
.sug .sl i{width:7px;height:7px;border-radius:50%;background:var(--ac2);box-shadow:0 0 10px var(--ac2);animation:blink 2s ease-in-out infinite}
.sug p{margin:10px 0 14px;color:var(--tx);font-size:14px}
