function okPop(){var d=document.createElement("div");d.className="okpop";d.innerHTML='<svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l8 8 14-16"/></svg>';document.body.appendChild(d);setTimeout(function(){d.remove()},1600)}
function pagar(id){S.cobr.forEach(function(c){if(c.id===id)c.pago=true});toast("Pagamento confirmado. Lembretes cancelados.");go("detalhe",id);okPop();haptic();checaFesta()}
function cobrarAtrasadas(){haptic();var n=S.cobr.filter(function(c){return!c.pago&&st(c).d<0}).length;toast(n?"Cobrança enviada para "+n+(n===1?" cliente":" clientes")+" em atraso":"Nenhum cliente em atraso")}
function cobrarAgora(id){haptic();var c=S.cobr.filter(function(x){return x.id===id})[0];toast("Cobrança enviada para "+c.nome+" por "+canaisTxt())}
function salvar(){
  var cl=S.clientes.filter(function(x){return x.id==$("nCli").value})[0];if(!cl){toast("Cadastre um cliente primeiro");return}
  var p=$("nDia").value.split("-");
  S.cobr.push({id:Date.now(),nome:cl.nome,zap:cl.zap,mail:cl.mail,valor:parseFloat($("nVal").value.replace(",","."))||0,venc:new Date(+p[0],p[1]-1,+p[2]),pago:false,rep:$("nRep").value});
  toast("Cobrança criada");go("cobrancas");
}
function cadastrar(){
  var e=$("rEmp").value.trim(),m=$("rMail").value.trim();
  if(!e||!m){toast("Preencha empresa e e-mail");return}
  S.emp={nome:$("rNome").value,empresa:e,doc:$("rDoc").value,mail:m,zap:$("rZap").value};
  S.empresa=e;toast("Conta criada");go("conta");
}
function salvarCliente(){
  var n=$("cNome").value.trim();if(!n){toast("Digite o nome do cliente");return}
  S.clientes.push({id:Date.now(),nome:n,doc:$("cDoc").value,zap:$("cZap").value||"—",mail:$("cMail").value||"—"});
  toast("Cliente salvo");go("clientes");
}
PV="welcome";render("welcome");
</script>
